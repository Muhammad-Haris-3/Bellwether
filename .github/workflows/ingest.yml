name: Ingest

# Every ten minutes.
#
# GitHub's cron is best-effort: runs are delayed under load and skipped
# entirely when the platform is busy. That is not worked around, because it
# cannot be. Ingestion resumes from a durable cursor instead, so a run that
# never happened becomes latency the next run absorbs — never a hole. The
# target is coverage, not punctuality.
#
# Scheduled workflows are disabled after 60 days without repository activity
# (SRS R-6). The staleness figure on the status page is what surfaces that,
# rather than silence.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "ISO timestamp to ingest from, ignoring the cursor (backfill / outage test)"
        required: false
        type: string

# A delayed run must never overlap its successor. The advisory lock in the job
# itself is the real guard — this only avoids queuing pointless runners.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest and derive free labels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BELLWETHER_DATABASE_URL: ${{ secrets.BELLWETHER_DATABASE_URL }}
      BELLWETHER_ENV: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # Pipeline requirements only. The dev set drags in pytest and respx,
      # which have no business running against the production database.
      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Ingest recent changes
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            python -m bellwether.ingest --since "${{ inputs.since }}"
          else
            python -m bellwether.ingest
          fi

      # Runs even when ingestion failed. This path costs no API calls at all —
      # it reads revert tags already in the database — so there is no reason to
      # skip it, and a partial ingestion is exactly when the cheapest available
      # labels are worth collecting.
      - name: Derive labels from revert tags
        if: always()
        run: python -m bellwether.label_secondary

      # Runs after ingestion, and also when ingestion failed — a failed run is
      # one of the ways a gap appears. Cheap when coverage is clean: a single
      # window query that returns nothing and exits. It only spends API calls
      # when there is a hole behind the cursor that an ordinary run cannot
      # reach, because ordinary runs only ever move forward.
      - name: Heal coverage gaps
        if: always()
        run: python -m bellwether.gapfill

      # Before scoring, so the batch about to be scored reads counters that
      # include every revert discovered since the last run.
      #
      # This is the half of the outcome the scorer cannot do for itself: when an
      # edit is scored nobody knows whether it will be reverted, and until this
      # step existed nothing came back later to say so. editor_edits_reverted
      # and page_edits_reverted reached the model as zero in production while
      # training saw real values.
      - name: Fold newly discovered reverts into state
        if: always()
        run: python -m bellwether.state --apply-reverts

      # Immediately after ingestion, so the gap between an edit and its score is
      # as small as this architecture allows. The scorer exits cleanly when no
      # model is registered, so this step is harmless before M3 completes.
      #
      # Model dependencies are installed only for this step, from their own
      # pinned file. The library version that trains an artifact must be the
      # one that scores with it, and pinning it in three workflow files would
      # drift.
      - name: Install the scoring dependencies
        if: always()
        run: pip install -r requirements-scoring.txt

      - name: Score newly ingested edits
        if: always()
        run: python -m bellwether.score

      - name: Surface the failure
        if: failure()
        run: |
          echo "::error title=ingest failed::Check landing.run_log for the job, \
          error class and window. The cursor will not have advanced past the \
          last committed page, so the next run resumes rather than skips."
