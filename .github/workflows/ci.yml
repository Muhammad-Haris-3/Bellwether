name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python, schema, grants
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The append-only guarantee is enforced by
    # database grants, and a grant cannot be tested against a fake — SET ROLE
    # and InsufficientPrivilege only exist on the real thing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bellwether
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BELLWETHER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bellwether
      # The db tests truncate every table, so they refuse to run against
      # BELLWETHER_DATABASE_URL and require this separate opt-in. In CI the
      # service container is disposable, so the two point at the same server —
      # but at different databases, so the guard stays meaningful here too.
      BELLWETHER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bellwether_test
      BELLWETHER_ENV: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy bellwether

      - name: Create the disposable test database
        run: psql "$BELLWETHER_DATABASE_URL" -c 'CREATE DATABASE bellwether_test'

      - name: Apply schema and grants
        run: |
          python -m bellwether.migrate
          BELLWETHER_DATABASE_URL="$BELLWETHER_TEST_DATABASE_URL" python -m bellwether.migrate

      - name: Tests, including the append-only guarantees
        run: |
          set -o pipefail
          pytest -v -rA 2>&1 | tee pytest-output.txt

      # GitHub requires sign-in to read job logs even on a public repository;
      # annotations are readable anonymously. Publishing the failure into an
      # annotation means anyone can see WHY a build broke without credentials,
      # which is the same principle the rest of the project runs on.
      - name: Surface the failure
        if: failure()
        run: |
          DETAIL=$(tail -60 pytest-output.txt \
            | sed 's/%/%25/g; s/\r//g' \
            | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest failed::$DETAIL"

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      # A placeholder value, not the real API. The build only needs the variable
      # to exist — Vercel supplies the real one, and it is inlined at build
      # time, so changing it there requires a redeploy rather than a save.
      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid
