name: Migrate

# Manual only — applies sql/ migrations against production in order.
#
# Run this once after any schema change, and specifically on 2026-10-01 when
# Neon's transfer allowance resets: sql/034 drops five large indexes (~53 MB)
# that have not yet been applied to the live database. Until those indexes are
# gone the storage cap will block the first write after the reset.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BELLWETHER_DATABASE_URL: ${{ secrets.BELLWETHER_DATABASE_URL }}
      BELLWETHER_ENV: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Apply migrations
        run: python -m bellwether.migrate
